<div class="nc-shop" style="margin-top: var(--nav-h, 68px)">

  <!-- HERO STRIP -->
  <section class="nc-shop-hero">
    <div class="nc-shop-hero__overlay"></div>
    <div class="nc-shop-hero__content">
      <p class="nc-eyebrow">✦ The Collection</p>
      <h1>Shop NamakwaChic</h1>
    </div>
  </section>

  <!-- SEARCH + SORT BAR -->
  <div class="nc-shop-bar">
    <div class="nc-shop-bar__search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input type="text" [(ngModel)]="searchQuery" (ngModelChange)="applyFilters()" placeholder="Search pieces…"/>
    </div>
    <div class="nc-shop-bar__right">
      <span class="nc-shop-bar__count">{{ filtered.length }} piece{{ filtered.length !== 1 ? 's' : '' }}</span>
      <select [(ngModel)]="sortBy" (ngModelChange)="applyFilters()" class="nc-shop-bar__sort">
        <option value="newest">Newest</option>
        <option value="price-asc">Price: Low to High</option>
        <option value="price-desc">Price: High to Low</option>
        <option value="name">Name A–Z</option>
      </select>
    </div>
  </div>

  <div class="nc-shop-body">

    <!-- FILTERS SIDEBAR -->
    <aside class="nc-filters">
      <div class="nc-filters__head">
        <h3>Filter</h3>
        <button class="nc-filters__clear" *ngIf="hasActiveFilters" (click)="clearFilters()">Clear all</button>
      </div>

      <div class="nc-filter-group" *ngIf="categories.length">
        <h4>Category</h4>
        <label *ngFor="let cat of categories" class="nc-filter-option">
          <input type="radio" name="cat" [value]="cat" [(ngModel)]="selectedCategory" (ngModelChange)="applyFilters()"/>
          {{ cat }}
        </label>
        <label class="nc-filter-option">
          <input type="radio" name="cat" value="" [(ngModel)]="selectedCategory" (ngModelChange)="applyFilters()"/>
          All Categories
        </label>
      </div>

      <div class="nc-filter-group">
        <h4>Size</h4>
        <div class="nc-filter-sizes">
          <button *ngFor="let s of sizes" class="nc-size-chip" [class.active]="selectedSize === s"
            (click)="selectedSize = (selectedSize === s ? '' : s); applyFilters()">{{ s }}</button>
        </div>
      </div>

      <div class="nc-filter-group" *ngIf="colors.length">
        <h4>Colour</h4>
        <label *ngFor="let c of colors" class="nc-filter-option">
          <input type="radio" name="col" [value]="c" [(ngModel)]="selectedColor" (ngModelChange)="applyFilters()"/>
          {{ c }}
        </label>
        <label class="nc-filter-option">
          <input type="radio" name="col" value="" [(ngModel)]="selectedColor" (ngModelChange)="applyFilters()"/>
          All Colours
        </label>
      </div>

      <div class="nc-filter-group">
        <h4>Price Range</h4>
        <div class="nc-filter-price">
          <input type="number" [(ngModel)]="minPrice" (ngModelChange)="applyFilters()" placeholder="Min R" class="nc-price-input"/>
          <span>–</span>
          <input type="number" [(ngModel)]="maxPrice" (ngModelChange)="applyFilters()" placeholder="Max R" class="nc-price-input"/>
        </div>
      </div>
    </aside>

    <!-- PRODUCT GRID -->
    <div class="nc-grid">
      <div class="nc-empty" *ngIf="filtered.length === 0">
        <p>No pieces match your filters.</p>
        <button (click)="clearFilters()">Clear Filters</button>
      </div>

      <article class="nc-product-card" *ngFor="let p of filtered" (click)="goToProduct(p.id)" style="cursor:pointer">
        <div class="nc-product-card__img">
          <img [src]="p.image" [alt]="p.name" onerror="this.src='assets/ProductPic/pic5.jpeg'"/>
          <span class="nc-product-card__badge" *ngIf="p.badge">{{ p.badge }}</span>
          <div class="nc-product-card__status nc-product-card__status--sold" *ngIf="p.status === 'outofstock'">Sold Out</div>
          <div class="nc-product-card__status nc-product-card__status--soon" *ngIf="p.status === 'comingsoon'">Coming Soon</div>
          <div class="nc-product-card__hover">
            <button class="nc-product-card__atc nc-product-card__view" (click)="goToProduct(p.id); $event.stopPropagation()">
              View Product
            </button>
            <button class="nc-product-card__atc" *ngIf="p.status !== 'outofstock' && p.status !== 'comingsoon'"
              (click)="addToCart(p); $event.stopPropagation()" [class.added]="addedId === p.id">
              {{ addedId === p.id ? '✓ Added' : 'Add to Bag' }}
            </button>
          </div>
        </div>
        <div class="nc-product-card__info">
          <p class="nc-product-card__cat">{{ p.category }}</p>
          <h3 class="nc-product-card__name">{{ p.name }}</h3>
          <div class="nc-product-card__sizes" *ngIf="p.sizes && p.sizes.length">
            <span *ngFor="let s of p.sizes">{{ s }}</span>
          </div>
          <div class="nc-product-card__price">
            <span class="nc-product-card__orig" *ngIf="p.originalPrice">R{{ p.originalPrice }}</span>
            <span>R{{ p.price }}</span>
          </div>
        </div>
      </article>
    </div>
  </div>
</div>
